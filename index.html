<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defence in depth for imported documents (their code is paused until trusted, see src/model/trust.ts).
         connect-src stays open: preview "Fetch URL" actions may call real APIs (SCOPE §5). -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>UI Extension Builder for HubSpot</title>
    <!-- Cold-start splash: pure HTML/CSS (no script), shown while the app loads — e.g. while a
         free-plan server wakes up — and replaced when the app mounts into #root. -->
    <style>
      .uiex-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: radial-gradient(900px 480px at 50% -8%, #fff1ea 0%, rgba(255, 241, 234, 0) 70%), #f4f5f7;
        color: #1f2633;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        animation: uiex-splash-in 0.3s ease 0.25s both;
      }
      .uiex-splash__logo {
        width: 44px;
        height: 44px;
      }
      .uiex-splash__title {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .uiex-splash__bar {
        position: relative;
        width: 180px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e1e4ea;
      }
      .uiex-splash__bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: inherit;
        background: #d1401c;
        animation: uiex-splash-slide 1.4s ease-in-out infinite;
      }
      .uiex-splash__note {
        max-width: 380px;
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #5f6878;
        animation: uiex-splash-in 0.4s ease 4s both;
      }
      .uiex-splash__note--late {
        animation-delay: 45s;
      }
      @keyframes uiex-splash-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes uiex-splash-slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .uiex-splash,
        .uiex-splash__note {
          animation-duration: 0.01s;
        }
        .uiex-splash__bar span {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="uiex-splash" role="status" aria-live="polite">
        <svg class="uiex-splash__logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#ff5c35" />
          <rect x="5" y="5" width="6" height="6" rx="1.6" fill="#fff" />
          <rect x="13" y="5" width="6" height="6" rx="1.6" fill="#fff" fill-opacity="0.55" />
          <rect x="5" y="13" width="6" height="6" rx="1.6" fill="#fff" fill-opacity="0.55" />
          <circle cx="16" cy="16" r="3.2" fill="#fff" />
        </svg>
        <p class="uiex-splash__title">Waking up the builder…</p>
        <div class="uiex-splash__bar" aria-hidden="true"><span></span></div>
        <p class="uiex-splash__note">The builder takes a short nap when nobody is using it. The first visit can take up to a minute — thanks for waiting.</p>
        <p class="uiex-splash__note uiex-splash__note--late">Still waiting? Check your internet connection, then reload the page.</p>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">The UI Extension Builder needs JavaScript. Turn it on in your browser and reload this page.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
